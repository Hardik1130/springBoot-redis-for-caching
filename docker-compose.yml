services:
  redis:
    image: redis:7.4
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
  
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    restart: always
    volumes:
      - ./volumes/redis-insight:/data

  postgres:
    container_name: docker-spring-postgres
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres@123
      - POSTGRES_DB=user_management
    ports:
      - "5433:5432"
    volumes:
      - './volumes/postgres_data:/var/lib/postgresql/data'
